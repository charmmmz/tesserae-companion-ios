name: TesseraeCompanion

options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  TesseraeKit:
    path: Packages/TesseraeKit

targets:
  TesseraeCompanion:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: SharedUI
      - path: App/Resources
        excludes:
          - Info.plist
          - TesseraeCompanion.entitlements
        buildPhase: resources
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tesserae Companion
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: Scan a Tesserae pairing QR code containing the local server address and a short-lived one-time code.
        NSBonjourServices:
          - _tesserae._tcp
        NSLocalNetworkUsageDescription: Discover and connect to your Tesserae server on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        TesseraeAppGroupIdentifier: group.com.charmmmz.tesseraecompanion
        TesseraeKeychainAccessGroup: $(AppIdentifierPrefix)com.charmmmz.tesseraecompanion.shared
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    dependencies:
      - package: TesseraeKit
      - target: TesseraeShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charmmmz.tesseraecompanion
        PRODUCT_NAME: Tesserae Companion
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 3MSS7DJGVR
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/Resources/TesseraeCompanion.entitlements
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"

  TesseraeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension/Sources
      - path: SharedUI
      - path: ShareExtension/Resources
        excludes:
          - Info.plist
          - TesseraeShare.entitlements
        buildPhase: resources
    info:
      path: ShareExtension/Resources/Info.plist
      properties:
        CFBundleDisplayName: Send to Tesserae
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Connect to your paired Tesserae server to send this image.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        TesseraeAppGroupIdentifier: group.com.charmmmz.tesseraecompanion
        TesseraeKeychainAccessGroup: $(AppIdentifierPrefix)com.charmmmz.tesseraecompanion.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
    dependencies:
      - package: TesseraeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charmmmz.tesseraecompanion.share
        PRODUCT_NAME: TesseraeShare
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        DEVELOPMENT_TEAM: 3MSS7DJGVR
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ShareExtension/Resources/TesseraeShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1"

  TesseraeCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: TesseraeCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charmmmz.tesseraecompanion.uitests
        DEVELOPMENT_TEAM: 3MSS7DJGVR
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TesseraeCompanion

schemes:
  TesseraeCompanion:
    build:
      targets:
        TesseraeCompanion: all
        TesseraeShare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TesseraeCompanionUITests
    archive:
      config: Release
