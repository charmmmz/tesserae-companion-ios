name: TesseraeCompanion

options:
  minimumXcodeGenVersion: 2.44.1
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  TesseraeKit:
    path: Packages/TesseraeKit

targets:
  TesseraeCompanion:
    type: application
    productName: Tesserae Companion
    platform: iOS
    sources:
      - path: App/Sources
      - path: SharedUI
      # The Debug host exercises the production share composer instead of a second UI.
      - path: ShareExtension/Sources
      - path: App/Resources
        excludes:
          - Info.plist
          - TesseraeCompanion.entitlements
        buildPhase: resources
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Tesserae
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UIAppFonts:
          - Phosphor.ttf
        NSBonjourServices:
          - _tesserae._tcp
        NSLocalNetworkUsageDescription: Discover and connect to your Tesserae server on the local network.
        NSBluetoothAlwaysUsageDescription: Find, securely configure, and send photos to nearby Tesserae displays.
        NSCameraUsageDescription: Scan the temporary setup code shown on a Tesserae display.
        NSPhotoLibraryUsageDescription: Select the Live Photo you are sharing so Tesserae can recover its motion when system sharing cannot provide it.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        NSRemindersFullAccessUsageDescription: Choose Reminders lists to send a minimal, expiring snapshot to your Tesserae server.
        NSHealthShareUsageDescription: Read only the Activity, Sleep, and Workout summaries you select and send a minimal seven-day snapshot directly to your paired Tesserae server.
        NSHealthUpdateUsageDescription: Tesserae does not write data to Health. HealthKit access is read-only and is used only to build the seven-day summaries you choose for your paired Tesserae server.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        TesseraeAppGroupIdentifier: group.com.charmmmz.tesseraecompanion
        TesseraeKeychainAccessGroup: $(AppIdentifierPrefix)com.charmmmz.tesseraecompanion.shared
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: TesseraeKit
      - target: TesseraeShare
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charmmmz.tesseraecompanion
        PRODUCT_NAME: Tesserae Companion
        MARKETING_VERSION: 0.8.1
        CURRENT_PROJECT_VERSION: 15
        DEVELOPMENT_TEAM: 3MSS7DJGVR
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: App/Resources/TesseraeCompanion.entitlements
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_OBJC_BRIDGING_HEADER: SharedUI/TesseraeShared-Bridging-Header.h
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        TARGETED_DEVICE_FAMILY: "1,2"

  TesseraeShare:
    type: app-extension
    platform: iOS
    sources:
      - path: ShareExtension/Sources
      - path: SharedUI
      - path: App/Sources/DeviceSetup/NearbyDeviceManager.swift
      - path: App/Sources/DeviceSetup/BLESetupProtocol.swift
      - path: App/Sources/DeviceSetup/BLEPhotoProtocol.swift
      - path: App/Sources/DeviceSetup/BluetoothDisplayStore.swift
      - path: App/Sources/DeviceSetup/LocalBluetoothPhotoRenderer.swift
      - path: App/Sources/DeviceSetup/PicPakPhotoEncoder.swift
      - path: App/Sources/PreviewImageState.swift
      - path: App/Sources/DesignSystem/PhosphorDashboardIcon.swift
      - path: App/Resources/Phosphor
        buildPhase: resources
      - path: ShareExtension/Resources
        excludes:
          - Info.plist
          - TesseraeShare.entitlements
        buildPhase: resources
    info:
      path: ShareExtension/Resources/Info.plist
      properties:
        CFBundleDisplayName: Send to Tesserae
        UIAppFonts:
          - Phosphor.ttf
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSLocalNetworkUsageDescription: Connect to your paired Tesserae server to send this shared item.
        NSBluetoothAlwaysUsageDescription: Find and send photos to nearby Tesserae displays already authorized in the app.
        NSPhotoLibraryUsageDescription: Select the Live Photo you are sharing so Tesserae can recover its motion when system sharing cannot provide it.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        TesseraeAppGroupIdentifier: group.com.charmmmz.tesseraecompanion
        TesseraeKeychainAccessGroup: $(AppIdentifierPrefix)com.charmmmz.tesseraecompanion.shared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 1
              NSExtensionActivationSupportsMovieWithMaxCount: 1
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    dependencies:
      - package: TesseraeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charmmmz.tesseraecompanion.share
        PRODUCT_NAME: TesseraeShare
        MARKETING_VERSION: 0.8.1
        CURRENT_PROJECT_VERSION: 15
        DEVELOPMENT_TEAM: 3MSS7DJGVR
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: ShareExtension/Resources/TesseraeShare.entitlements
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_OBJC_BRIDGING_HEADER: SharedUI/TesseraeShared-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1,2"

  TesseraeCompanionUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    dependencies:
      - target: TesseraeCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charmmmz.tesseraecompanion.uitests
        DEVELOPMENT_TEAM: 3MSS7DJGVR
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: TesseraeCompanion

  TesseraeCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: App/Tests
    dependencies:
      - target: TesseraeCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.charmmmz.tesseraecompanion.tests
        DEVELOPMENT_TEAM: 3MSS7DJGVR
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Tesserae Companion.app/Tesserae Companion
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  TesseraeCompanion:
    build:
      targets:
        TesseraeCompanion: all
        TesseraeShare: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - TesseraeCompanionTests
        - TesseraeCompanionUITests
    archive:
      config: Release
