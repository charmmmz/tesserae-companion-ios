openapi: 3.0.3
info:
  title: Tesserae Companion API
  version: 0.8.0
  description: >-
    Companion API contract for community-built clients. Previews, History,
    resend, remote-image push, webpage push, and server-advertised image fit
    modes are optional additive extensions over the five-feature compatibility
    floor. Image framing and the privacy-preserving Reminders snapshot bridge
    are independently capability-gated additive extensions. New Reminders
    clients require `reminders` in `personal_data.sources`; they do not infer
    generic support from the legacy feature flag or fall back to
    `reminders.fridge`.
servers:
  - url: /
tags:
  - name: Discovery
  - name: Pairing
  - name: Displays
  - name: Dashboards
  - name: Images
  - name: Webpages
  - name: Jobs
  - name: Lineups
  - name: History
  - name: Personal Data
paths:
  /api/app/v1:
    get:
      tags: [Discovery]
      operationId: getCompanionCapabilities
      summary: Probe Companion API support without exposing household content
      security: []
      responses:
        "200":
          description: Supported capabilities and current resource limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Capabilities"
  /api/app/v1/pair:
    post:
      tags: [Pairing]
      operationId: pairCompanion
      summary: Exchange a single-use Companion code for a client credential
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairingRequest"
      responses:
        "201":
          description: Credential returned once
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PairingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/app/v1/session:
    delete:
      tags: [Pairing]
      operationId: revokeCompanionSession
      summary: Revoke the presented Companion credential
      responses:
        "204":
          description: Credential revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/personal-data/status:
    get:
      tags: [Personal Data]
      operationId: getCompanionPersonalDataStatus
      summary: List snapshot freshness metadata without returning personal values
      description: >-
        Returns only source identifiers and timestamps. Snapshot payload values
        are intentionally unavailable through the Companion read surface.
      responses:
        "200":
          description: Metadata for currently stored or expired snapshot sources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalDataStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/personal-data/{source_id}:
    parameters:
      - $ref: "#/components/parameters/PersonalDataSourceID"
    put:
      tags: [Personal Data]
      operationId: putCompanionPersonalDataSnapshot
      summary: Replace the latest snapshot for one advertised personal-data source
      description: >-
        Validates and atomically replaces the source's latest snapshot. This
        synchronous storage operation does not render a dashboard, publish to a
        display, create a Job, or write History. A retry with the same generated
        timestamp and payload is idempotent; an older snapshot or conflicting
        payload at the same timestamp is refused so delayed background work
        cannot replace newer data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalDataSnapshot"
      responses:
        "200":
          description: Snapshot accepted as the source's latest value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalDataSourceStatus"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Personal Data]
      operationId: deleteCompanionPersonalDataSnapshot
      summary: Delete the latest snapshot when its source is disabled
      description: >-
        Idempotently removes the raw snapshot immediately. Previously rendered
        compositions remain governed by the existing render-cache and History
        policy and are not personal-data snapshot records.
      responses:
        "204":
          description: Snapshot absent after the request
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/devices:
    get:
      tags: [Displays]
      operationId: listCompanionDevices
      summary: List stable display targets and lightweight status
      responses:
        "200":
          description: Displays visible to the Companion role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DevicesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/devices/{device_id}/preview:
    parameters:
      - $ref: "#/components/parameters/DeviceID"
    get:
      tags: [Displays]
      operationId: getCompanionDevicePreview
      summary: Read the device's last-served or exact pending preview
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - in: query
          name: revision
          required: false
          description: >-
            Exact pending-render revision advertised by the devices list.
            Omit it to read the display's last-served preview.
          schema:
            type: string
      responses:
        "200":
          description: >-
            With revision, the exact retained pending PNG. Without revision,
            for REST polling devices, the last viewable PNG served through the
            device frame endpoint after image fit and device geometry have
            been applied. Other transports fall back to the latest server
            render. Renderer-specific palette and quantisation should be
            represented when a reusable PNG can be produced from that stage.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            image/png:
              schema:
                type: string
                format: binary
        "304":
          description: The cached device preview is still current
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/app/v1/dashboards:
    get:
      tags: [Dashboards]
      operationId: listCompanionDashboards
      summary: List dashboards without forcing preview renders
      responses:
        "200":
          description: Saved dashboards
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/dashboards/{dashboard_id}/preview:
    parameters:
      - $ref: "#/components/parameters/DashboardID"
    get:
      tags: [Dashboards]
      operationId: getCompanionDashboardPreview
      summary: Read or asynchronously prepare a cached dashboard preview
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
        - in: query
          name: device_id
          required: false
          description: Optional target display whose panel dimensions should be used
          schema:
            type: string
      responses:
        "200":
          description: Cached dashboard composition PNG
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            image/png:
              schema:
                type: string
                format: binary
        "202":
          description: A background preview render has been accepted
          headers:
            Retry-After:
              description: Suggested retry delay in seconds
              schema:
                type: integer
                minimum: 1
        "304":
          description: The cached composition is still current
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/app/v1/dashboards/{dashboard_id}/push:
    parameters:
      - $ref: "#/components/parameters/DashboardID"
    post:
      tags: [Dashboards]
      operationId: pushCompanionDashboard
      summary: Render a dashboard for its bindings or explicit targets
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DashboardPushRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/app/v1/images:
    post:
      tags: [Images]
      operationId: pushCompanionImage
      summary: Send one still image to explicit display targets
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image, request]
              properties:
                image:
                  type: string
                  format: binary
                request:
                  $ref: "#/components/schemas/ImagePushRequest"
            encoding:
              request:
                contentType: application/json
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          description: Encoded or decoded image exceeds advertised limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "415":
          description: Unsupported still-image media type
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/app/v1/image-urls:
    post:
      tags: [Images]
      operationId: pushCompanionImageURL
      summary: Fetch one public image URL and send it to explicit display targets
      description: >-
        Persist an asynchronous Job that fetches the source once through the
        strict Companion URL policy, then applies the selected fit per target
        through the existing push fan-out. The server must refuse private,
        loopback, link-local, and embedded-credential destinations, including
        redirect targets. There is no Companion override for this policy.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageURLPushRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/app/v1/webpages:
    post:
      tags: [Webpages]
      operationId: pushCompanionWebpage
      summary: Render one public webpage and send it to explicit display targets
      description: >-
        Persist an asynchronous Job that performs one bounded server-side
        top-level Chromium render at the logical viewport, then applies the
        selected fit per target through the existing push fan-out. The render
        must reuse the same queue, timeout, concurrency, cache, and rendering
        primitive as the Web UI's manual Server preview, without relying on
        whether the page permits iframe embedding. The Companion call uses the
        strict URL policy and, unlike a preview-only render, publishes and
        records canonical History.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebpagePushRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/app/v1/lineups:
    get:
      tags: [Lineups]
      operationId: listCompanionLineups
      summary: Read all Lineups without hiding advanced server-owned fields
      description: >-
        Requires lineups:read. The resource noun is Lineup even though the
        server's unified internal model is Deck. native_editable is advisory
        and server-computed; false never permits the client to discard fields.
      responses:
        "200":
          description: Complete Lineup definitions and lightweight runtime state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/lineups/{lineup_id}:
    parameters:
      - $ref: "#/components/parameters/LineupID"
    get:
      tags: [Lineups]
      operationId: getCompanionLineup
      summary: Read one complete Lineup
      responses:
        "200":
          description: Complete Lineup definition and runtime state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/app/v1/lineups/{lineup_id}/actions:
    parameters:
      - $ref: "#/components/parameters/LineupID"
    post:
      tags: [Lineups]
      operationId: controlCompanionLineup
      summary: Change Lineup state or repaint one or more bound displays
      description: >-
        Requires lineups:control. enable and disable are idempotent stored-state
        flips and return the updated Lineup synchronously. next, previous, and
        play repaint displays through Jobs, quiet-hours policy, idempotency, and
        canonical History. None of these actions edits the Lineup definition.
      parameters:
        - $ref: "#/components/parameters/ConditionalIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LineupActionRequest"
      responses:
        "200":
          description: Updated Lineup after enable or disable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LineupResponse"
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/app/v1/jobs/{job_id}:
    parameters:
      - $ref: "#/components/parameters/JobID"
    get:
      tags: [Jobs]
      operationId: getCompanionJob
      summary: Poll an asynchronous render and publish job
      responses:
        "200":
          description: Current job state
          headers:
            Retry-After:
              description: Suggested poll delay in seconds while non-terminal
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/app/v1/history:
    get:
      tags: [History]
      operationId: listCompanionHistory
      summary: List canonical server push History, newest first
      parameters:
        - in: query
          name: before_id
          required: false
          description: Opaque cursor returned as next_before_id by the previous page
          schema:
            type: string
        - in: query
          name: limit
          required: false
          description: Requested page size, bounded by the server
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Canonical push History page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/app/v1/history/{history_id}/preview:
    parameters:
      - $ref: "#/components/parameters/HistoryID"
    get:
      tags: [History]
      operationId: getCompanionHistoryPreview
      summary: Read the retained composition thumbnail for a History row
      parameters:
        - $ref: "#/components/parameters/IfNoneMatch"
      responses:
        "200":
          description: >-
            Stored composition PNG identifying what was sent. This is not a
            device-final preview.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            image/png:
              schema:
                type: string
                format: binary
        "304":
          description: The cached History composition is still current
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/app/v1/history/{history_id}/resend:
    parameters:
      - $ref: "#/components/parameters/HistoryID"
    post:
      tags: [History]
      operationId: resendCompanionHistory
      summary: Republish a retained composition to its original target snapshot
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoryResendRequest"
      responses:
        "202":
          $ref: "#/components/responses/JobAccepted"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    CompanionBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
  parameters:
    DeviceID:
      in: path
      name: device_id
      required: true
      schema:
        type: string
    DashboardID:
      in: path
      name: dashboard_id
      required: true
      schema:
        type: string
    JobID:
      in: path
      name: job_id
      required: true
      schema:
        type: string
    HistoryID:
      in: path
      name: history_id
      required: true
      schema:
        type: string
    LineupID:
      in: path
      name: lineup_id
      required: true
      schema:
        type: string
    PersonalDataSourceID:
      in: path
      name: source_id
      required: true
      description: Source advertised by the corresponding capability flag
      schema:
        $ref: "#/components/schemas/PersonalDataSourceID"
    IdempotencyKey:
      in: header
      name: Idempotency-Key
      required: true
      description: >-
        Opaque client-generated key. Reusing a key with the same credential,
        method, path, and payload returns the original job; changing the payload
        returns idempotency_conflict.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    ConditionalIdempotencyKey:
      in: header
      name: Idempotency-Key
      required: false
      description: >-
        Required for next, previous, and play, which create asynchronous Jobs.
        Omit for enable and disable, whose state flips are idempotent by
        construction and return synchronously.
      schema:
        type: string
        minLength: 16
        maxLength: 128
    IfNoneMatch:
      in: header
      name: If-None-Match
      required: false
      description: ETag from a previously returned preview
      schema:
        type: string
  headers:
    ETag:
      description: Content-addressed preview validator
      schema:
        type: string
  responses:
    JobAccepted:
      description: Job persisted for asynchronous execution
      headers:
        Location:
          description: Relative URL of the job resource
          schema:
            type: string
        Retry-After:
          description: Suggested first poll delay in seconds
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/JobResponse"
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, invalid, or revoked Companion credential
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found or not visible to this client
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Pairing code or idempotency-key conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Capabilities:
      type: object
      additionalProperties: false
      required: [product, server_version, api, pairing, features, limits, web_url]
      properties:
        product:
          type: string
          enum: [tesserae]
        server_version:
          type: string
        api:
          type: object
          additionalProperties: false
          required: [name, version]
          properties:
            name:
              type: string
              enum: [companion]
            version:
              type: integer
              minimum: 1
        pairing:
          type: object
          additionalProperties: false
          required: [supported, code_length, ttl_seconds]
          properties:
            supported:
              type: boolean
            code_length:
              type: integer
              minimum: 6
              maximum: 12
            ttl_seconds:
              type: integer
              minimum: 60
        features:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - devices
              - dashboards
              - dashboard_push
              - image_push
              - jobs
              - previews
              - history
              - image_url_push
              - webpage_push
              - image_framing
              - personal_data_reminders
              - lineups
              - lineup_control
        personal_data:
          $ref: "#/components/schemas/PersonalDataCapabilities"
        limits:
          $ref: "#/components/schemas/Limits"
        web_url:
          type: string
    Limits:
      type: object
      additionalProperties: false
      required:
        - image_upload_bytes
        - image_max_edge
        - image_content_types
        - job_retention_seconds
        - idempotency_retention_seconds
      properties:
        image_upload_bytes:
          type: integer
          minimum: 1
        image_max_edge:
          type: integer
          minimum: 1
        image_content_types:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
              - image/jpeg
              - image/png
              - image/heic
              - image/heif
              - image/webp
        image_fit_modes:
          description: >-
            Image layout modes accepted by POST /images. When absent, clients
            must assume only fit and fill for compatibility with contract 0.2.0.
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ImageFitMode"
        image_framing_max_zoom:
          description: >-
            Maximum zoom accepted inside ImageFraming. A server advertising
            image_framing must publish this limit so clients do not hard-code
            an editor range.
          type: number
          minimum: 1
        personal_data_stale_after_seconds:
          description: >-
            Age at which an accepted personal-data snapshot becomes stale.
            Required whenever any personal-data capability is advertised.
          type: integer
          minimum: 60
        personal_data_max_ttl_seconds:
          description: >-
            Maximum allowed difference between generated_at and expires_at.
            Required whenever any personal-data capability is advertised.
          type: integer
          minimum: 60
        job_retention_seconds:
          type: integer
          minimum: 60
        idempotency_retention_seconds:
          type: integer
          minimum: 60
    PersonalDataCapabilities:
      description: >-
        Strict personal-data source schemas accepted by this server. Absent on
        servers that predate source advertisement; those servers signal
        personal-data support through feature flags only.
      type: object
      additionalProperties: false
      required: [sources]
      properties:
        sources:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PersonalDataSourceID"
    PairingRequest:
      type: object
      additionalProperties: false
      required: [code, client]
      properties:
        code:
          type: string
          pattern: "^[0-9]{6,12}$"
        client:
          type: object
          additionalProperties: false
          required: [name, platform, app_version, installation_id]
          properties:
            name:
              type: string
              minLength: 1
              maxLength: 80
            platform:
              type: string
              enum: [ios]
            app_version:
              type: string
            installation_id:
              type: string
              minLength: 16
              maxLength: 128
    PairingResponse:
      type: object
      additionalProperties: false
      required: [token, token_id, scopes, created_at, instance]
      properties:
        token:
          type: string
          minLength: 24
          writeOnly: true
        token_id:
          type: string
        scopes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - devices:read
              - dashboards:read
              - push:write
              - media:write
              - personal_data:write
              - lineups:read
              - lineups:control
        created_at:
          type: string
          format: date-time
        instance:
          $ref: "#/components/schemas/Instance"
    Instance:
      type: object
      additionalProperties: false
      required: [id, name, server_version, timezone, web_url]
      properties:
        id:
          type: string
        name:
          type: string
        server_version:
          type: string
        timezone:
          type: string
        web_url:
          type: string
    PersonalDataSourceID:
      type: string
      enum:
        - reminders
        - reminders.fridge
    PersonalDataSnapshot:
      description: >-
        Versioned, expiring snapshot envelope. Each source is a strict schema;
        this is not an arbitrary JSON storage endpoint.
      oneOf:
        - $ref: "#/components/schemas/RemindersSnapshot"
        - $ref: "#/components/schemas/RemindersFridgeSnapshot"
      discriminator:
        propertyName: source_id
        mapping:
          reminders: "#/components/schemas/RemindersSnapshot"
          reminders.fridge: "#/components/schemas/RemindersFridgeSnapshot"
    RemindersSnapshot:
      type: object
      additionalProperties: false
      required: [version, source_id, generated_at, expires_at, data]
      properties:
        version:
          type: string
          enum: [personal_data_bridge_v1]
        source_id:
          type: string
          enum: [reminders]
        generated_at:
          type: string
          format: date-time
        expires_at:
          description: Required deletion deadline for raw snapshot values
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/RemindersData"
    RemindersData:
      description: >-
        Incomplete items grouped by user-approved Apple Reminders lists. List
        identifiers are opaque, app-generated publication identifiers rather
        than EventKit calendar identifiers and must be unique within one
        snapshot; duplicate ids are rejected as invalid_snapshot (400). At
        most 200 items may appear across all lists in one snapshot. Exceeding
        that aggregate cap is rejected as invalid_snapshot (400), never
        truncated by the server. An empty lists array means no lists are
        currently published; the source remains fresh and widgets show their
        selected-list-unavailable state. DELETE is reserved for disabling the
        source.
      type: object
      additionalProperties: false
      required: [lists]
      properties:
        lists:
          description: >-
            Complete atomic set of currently published lists. An empty array is
            a valid enabled snapshot, not a request to delete the source.
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/ReminderListSnapshot"
    ReminderListSnapshot:
      type: object
      additionalProperties: false
      required: [id, title, items]
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 256
        title:
          type: string
          minLength: 1
          maxLength: 256
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ReminderSnapshotItem"
    RemindersFridgeSnapshot:
      deprecated: true
      description: >-
        Deprecated one-list compatibility source retained for the already
        published reminders_fridge widget. New clients and widgets should use
        grouped reminders rather than implement this fallback.
      type: object
      additionalProperties: false
      required: [version, source_id, generated_at, expires_at, data]
      properties:
        version:
          type: string
          enum: [personal_data_bridge_v1]
        source_id:
          type: string
          enum: [reminders.fridge]
        generated_at:
          description: Time at which the iPhone generated this complete snapshot
          type: string
          format: date-time
        expires_at:
          description: >-
            Required deletion deadline for raw snapshot values. It must be later
            than generated_at and conform to the server retention policy.
          type: string
          format: date-time
        data:
          $ref: "#/components/schemas/RemindersFridgeData"
    RemindersFridgeData:
      description: >-
        Incomplete items selected from one user-approved Reminders list. Notes,
        URLs, alarms, locations, and unrelated lists are never included.
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          maxItems: 200
          items:
            $ref: "#/components/schemas/ReminderSnapshotItem"
    ReminderSnapshotItem:
      type: object
      additionalProperties: false
      required: [id, title, due_date, priority, completed]
      properties:
        id:
          description: Opaque reminder identifier used only inside this snapshot
          type: string
          minLength: 1
          maxLength: 256
        title:
          type: string
          minLength: 1
          maxLength: 512
        due_date:
          description: Local calendar date selected in Reminders, or null
          type: string
          format: date
          nullable: true
        priority:
          description: Normalized priority rather than EventKit's numeric value
          type: string
          enum: [none, low, medium, high]
        completed:
          description: Defense-in-depth marker; the first source contains only incomplete items
          type: boolean
          enum: [false]
    PersonalDataFreshness:
      type: string
      enum: [fresh, stale, expired]
    PersonalDataSourceStatus:
      description: Metadata only; raw snapshot values are never returned here
      type: object
      additionalProperties: false
      required: [source_id, state, generated_at, stale_at, expires_at]
      properties:
        source_id:
          $ref: "#/components/schemas/PersonalDataSourceID"
        state:
          $ref: "#/components/schemas/PersonalDataFreshness"
        generated_at:
          type: string
          format: date-time
        stale_at:
          description: >-
            Server-computed generated_at plus the advertised stale interval.
            State is stale at or after this time and before expires_at.
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
    PersonalDataStatusResponse:
      type: object
      additionalProperties: false
      required: [sources]
      properties:
        sources:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/PersonalDataSourceStatus"
    DevicesResponse:
      type: object
      additionalProperties: false
      required: [devices]
      properties:
        devices:
          type: array
          items:
            $ref: "#/components/schemas/Device"
    Device:
      type: object
      additionalProperties: false
      required: [id, name, kind, icon, panel, freshness]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
        icon:
          description: >-
            Bare Phosphor icon name resolved from the device kind or its
            per-instance override.
          type: string
        panel:
          $ref: "#/components/schemas/Panel"
        freshness:
          type: string
          enum: [fresh, stale, unknown]
        last_seen_at:
          type: string
          format: date-time
          nullable: true
        battery_percent:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true
        rssi_dbm:
          type: integer
          nullable: true
        firmware_version:
          type: string
          nullable: true
        has_pending_render:
          type: boolean
          description: >-
            True when a REST polling device has not yet fetched the server's
            latest render. False for transports without a reliable served
            signal. Absent on older compatible servers.
        pending_render:
          allOf:
            - $ref: "#/components/schemas/PendingRender"
          description: >-
            Exact newer frame waiting for this REST polling display. Absent
            when no retained pending preview exists or on older compatible
            servers.
    PendingRender:
      type: object
      additionalProperties: false
      required: [revision, preview_url]
      properties:
        revision:
          type: string
        rendered_at:
          type: string
          format: date-time
          nullable: true
        preview_url:
          type: string
          description: Authenticated Companion path for this exact revision.
    Panel:
      type: object
      additionalProperties: false
      required: [width, height, gamut, orientation]
      properties:
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        gamut:
          type: string
        orientation:
          type: string
          enum: [portrait, landscape]
    DashboardsResponse:
      type: object
      additionalProperties: false
      required: [dashboards]
      properties:
        dashboards:
          type: array
          items:
            $ref: "#/components/schemas/Dashboard"
    Dashboard:
      type: object
      additionalProperties: false
      required: [id, name, kind, device_ids]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [grid, canvas]
        icon:
          description: Bare Phosphor icon name used by the dashboard
          type: string
          nullable: true
        device_ids:
          type: array
          uniqueItems: true
          items:
            type: string
        updated_at:
          type: string
          format: date-time
          nullable: true
        web_url:
          type: string
          nullable: true
    DashboardPushRequest:
      type: object
      additionalProperties: false
      required: [override_quiet_hours]
      properties:
        device_ids:
          description: Omit to use dashboard bindings
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        override_quiet_hours:
          type: boolean
          default: false
    ImagePushRequest:
      type: object
      additionalProperties: false
      required: [device_ids, fit, override_quiet_hours]
      properties:
        device_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        fit:
          $ref: "#/components/schemas/ImageFitMode"
        framing:
          description: >-
            Optional server-resolved composition intent. It is accepted only
            with fit=fill and when image_framing is advertised. The same intent
            is resolved independently for every target panel, so mixed target
            aspect ratios do not share one fixed crop rectangle. Omit it for
            the existing centered Fill behavior.
          allOf:
            - $ref: "#/components/schemas/ImageFraming"
        override_quiet_hours:
          type: boolean
          default: false
    ImageFraming:
      description: >-
        Normalized subject framing resolved independently for each target. The
        server applies EXIF orientation before interpreting these coordinates,
        so source_width/source_height and focus_x/focus_y all refer to the
        orientation-normalized image as displayed. Let source_aspect be
        source_width/source_height and target_aspect be
        target_width/target_height. Ordinary Fill exposes a normalized source
        crop of target_aspect/source_aspect by 1 when the source is wider than
        the target, otherwise 1 by source_aspect/target_aspect. Divide both crop
        dimensions by zoom, center that rectangle on focus_x/focus_y, then
        clamp its origin so the rectangle remains inside [0,1]. The resulting
        rectangle feeds the server's SourceCrop primitive before the existing
        Fill operation. Pixel rounding and the minimum non-empty crop remain
        server-owned.
      type: object
      additionalProperties: false
      required: [focus_x, focus_y, zoom]
      properties:
        focus_x:
          description: >-
            Horizontal subject focus in normalized, EXIF-orientation-normalized
            source-image space
          type: number
          minimum: 0
          maximum: 1
        focus_y:
          description: >-
            Vertical subject focus in normalized, EXIF-orientation-normalized
            source-image space
          type: number
          minimum: 0
          maximum: 1
        zoom:
          description: >-
            Scale relative to the minimum Fill scale. 1 is ordinary Fill;
            larger values crop more tightly and must not exceed the server's
            advertised limits.image_framing_max_zoom.
          type: number
          minimum: 1
    RemoteSourceURL:
      description: >-
        Absolute HTTP(S) URL without embedded credentials. Companion-triggered
        fetches use a strict public-network policy: private, loopback,
        link-local, reserved, unspecified, and equivalent redirect destinations
        are refused. The client cannot override that policy.
      type: string
      format: uri
      minLength: 8
      maxLength: 4096
      pattern: "^https?://[^\\s]+$"
    ImageURLPushRequest:
      type: object
      additionalProperties: false
      required: [url, device_ids, fit, override_quiet_hours]
      properties:
        url:
          $ref: "#/components/schemas/RemoteSourceURL"
        device_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        fit:
          $ref: "#/components/schemas/ImageFitMode"
        override_quiet_hours:
          type: boolean
          default: false
    WebpagePushRequest:
      type: object
      additionalProperties: false
      required: [url, device_ids, fit, override_quiet_hours]
      properties:
        url:
          $ref: "#/components/schemas/RemoteSourceURL"
        device_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        fit:
          $ref: "#/components/schemas/ImageFitMode"
        viewport_w:
          description: >-
            Optional advanced logical browser width. The server defaults to
            1280 and owns the logical capture height. It renders once at that
            logical size and does not re-render for each target display.
          type: integer
          minimum: 200
          maximum: 4096
          default: 1280
        override_quiet_hours:
          type: boolean
          default: false
    ImageFitMode:
      type: string
      enum: [fit, fill, blur, stretch, center]
    LineupsResponse:
      type: object
      additionalProperties: false
      required: [lineups]
      properties:
        lineups:
          type: array
          items:
            $ref: "#/components/schemas/Lineup"
    LineupResponse:
      type: object
      additionalProperties: false
      required: [lineup]
      properties:
        lineup:
          $ref: "#/components/schemas/Lineup"
    Lineup:
      description: >-
        Public read projection of the server's unified Deck model. Fields through
        anchor match the v0.289.2 implementation. The remaining scheduling and
        navigation fields are additive 0.8 contract requirements so an advanced
        Lineup remains fully describable when native_editable is false. The
        internal legacy_kind migration marker is intentionally not public.
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - enabled
        - intent
        - device_ids
        - dashboards
        - current
        - next_advance_epoch
        - advance
        - trigger
        - interval_minutes
        - fires_at
        - anchor
        - entry_page_id
        - home_page_id
        - home_timeout_minutes
        - refresh_interval_minutes
        - end_at
        - days_of_week
        - priority
        - smart_sync
        - smart_sync_lead_seconds
        - mode
        - min_hold_minutes
        - window_start
        - window_end
        - fallback_page_id
        - native_editable
        - requires_web_reason
        - web_url
      properties:
        id:
          type: string
          pattern: "^[a-z0-9_][a-z0-9_-]*$"
        name:
          type: string
          minLength: 1
        enabled:
          type: boolean
        intent:
          description: >-
            Server-computed mapping to the four user-facing wizard intents, or
            null when the stored trigger cannot be represented by one of them.
          type: string
          enum: [daily, interval, cycle, manual]
          nullable: true
        device_ids:
          description: Displays bound to this Lineup
          type: array
          uniqueItems: true
          items:
            type: string
        dashboards:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/LineupDashboard"
        current:
          description: Per-display navigation state; bound displays may differ
          type: array
          items:
            $ref: "#/components/schemas/LineupCurrent"
        next_advance_epoch:
          description: Next scheduled advance as Unix epoch seconds, when known
          type: integer
          format: int64
          nullable: true
        advance:
          type: string
          enum: [manual, timer, both]
        trigger:
          type: string
          enum: [cycle, interval, daily]
          nullable: true
        interval_minutes:
          type: integer
          minimum: 1
          maximum: 10080
          nullable: true
        fires_at:
          allOf:
            - $ref: "#/components/schemas/LocalTime"
          nullable: true
        anchor:
          allOf:
            - $ref: "#/components/schemas/LocalTime"
          nullable: true
        entry_page_id:
          type: string
          nullable: true
        home_page_id:
          type: string
          nullable: true
        home_timeout_minutes:
          type: integer
          minimum: 0
          maximum: 120
        refresh_interval_minutes:
          type: integer
          minimum: 0
          maximum: 1440
        end_at:
          allOf:
            - $ref: "#/components/schemas/LocalTime"
          nullable: true
        days_of_week:
          type: array
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            maximum: 6
        priority:
          type: integer
        smart_sync:
          type: boolean
        smart_sync_lead_seconds:
          type: integer
          minimum: 0
          maximum: 600
        mode:
          type: string
          enum: [scheduled, priority]
        min_hold_minutes:
          type: integer
          minimum: 0
          maximum: 120
        window_start:
          allOf:
            - $ref: "#/components/schemas/LocalTime"
          nullable: true
        window_end:
          allOf:
            - $ref: "#/components/schemas/LocalTime"
          nullable: true
        fallback_page_id:
          type: string
          nullable: true
        native_editable:
          description: Server-computed; false makes the definition read/control-only
          type: boolean
        requires_web_reason:
          description: Human-readable reason native editing is unavailable
          type: string
          nullable: true
        web_url:
          type: string
    LocalTime:
      type: string
      pattern: "^([01]\\d|2[0-3]):[0-5]\\d$"
    LineupDashboard:
      type: object
      additionalProperties: false
      required:
        - page_id
        - name
        - dwell_minutes
        - missing
        - refresh_interval_minutes
        - links
        - conditions
      properties:
        page_id:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1
        dwell_minutes:
          description: Effective dwell after applying the Lineup default
          type: integer
          minimum: 1
          maximum: 10080
        missing:
          description: True when the referenced Dashboard has been deleted
          type: boolean
        refresh_interval_minutes:
          description: Raw per-Dashboard override; null inherits the Lineup default
          type: integer
          minimum: 0
          maximum: 1440
          nullable: true
        links:
          type: array
          items:
            $ref: "#/components/schemas/LineupLink"
        conditions:
          type: array
          items:
            $ref: "#/components/schemas/LineupCondition"
    LineupCurrent:
      type: object
      additionalProperties: false
      required: [device_id, page_id]
      properties:
        device_id:
          type: string
        page_id:
          type: string
    LineupLink:
      description: Exactly one of button or zone is non-null
      type: object
      additionalProperties: false
      required: [target_page_id, button, zone]
      properties:
        target_page_id:
          type: string
          minLength: 1
        button:
          type: string
          nullable: true
        zone:
          allOf:
            - $ref: "#/components/schemas/LineupZone"
          nullable: true
    LineupZone:
      type: object
      additionalProperties: false
      required: [x, y, w, h]
      properties:
        x: {type: number, minimum: 0, maximum: 1}
        y: {type: number, minimum: 0, maximum: 1}
        w: {type: number, minimum: 0.000001, maximum: 1}
        h: {type: number, minimum: 0.000001, maximum: 1}
    LineupCondition:
      description: >-
        One upstream condition tuple. value remains structurally open because
        its shape is selected by source_kind and operator; clients must preserve
        unknown additive condition forms when rendering a read-only summary.
      type: object
      additionalProperties: false
      required: [source_kind, source_id, operator, value]
      properties:
        source_kind:
          type: string
          enum: [ha_entity, time_window, sun]
        source_id:
          type: string
        operator:
          type: string
        value:
          nullable: true
    LineupActionRequest:
      description: >-
        State actions return 200 with the updated Lineup. Paint actions return
        202 with a Job; play requires page_id from this Lineup, while next and
        previous omit page_id. device_ids, when present, must be bound to it.
      oneOf:
        - $ref: "#/components/schemas/LineupStateActionRequest"
        - $ref: "#/components/schemas/LineupPaintActionRequest"
    LineupStateActionRequest:
      type: object
      additionalProperties: false
      required: [action]
      properties:
        action:
          type: string
          enum: [enable, disable]
    LineupPaintActionRequest:
      type: object
      additionalProperties: false
      required: [action, override_quiet_hours]
      properties:
        action:
          type: string
          enum: [next, previous, play]
        page_id:
          type: string
        device_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
        override_quiet_hours:
          type: boolean
          default: false
    HistoryResponse:
      type: object
      additionalProperties: false
      required: [items, next_before_id]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/HistoryItem"
        next_before_id:
          description: Opaque cursor for the next older page, or null at the end
          type: string
          nullable: true
    HistoryItem:
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - source
        - label
        - device_ids
        - status
        - preview_available
        - resendable
      properties:
        id:
          type: string
        created_at:
          type: string
          format: date-time
        source:
          description: Stable server source identifier, additive over time
          type: string
        label:
          type: string
        device_ids:
          description: Snapshot of the original delivery targets
          type: array
          uniqueItems: true
          items:
            type: string
        status:
          description: Stable push outcome identifier, additive over time
          type: string
        duration_seconds:
          type: number
          minimum: 0
          nullable: true
        error:
          type: string
          nullable: true
        preview_available:
          type: boolean
        resendable:
          type: boolean
        fit:
          description: Original image fit mode when the source was arbitrary media
          allOf:
            - $ref: "#/components/schemas/ImageFitMode"
          nullable: true
        framing:
          description: >-
            Original normalized framing intent when the image was sent with
            image_framing. It is returned for reproduction or re-targeting.
            Resolved per-target crop rectangles are derived server-internal
            state rather than part of the public History contract.
          allOf:
            - $ref: "#/components/schemas/ImageFraming"
          nullable: true
    HistoryResendRequest:
      type: object
      additionalProperties: false
      required: [override_quiet_hours]
      properties:
        override_quiet_hours:
          type: boolean
          default: false
    JobResponse:
      type: object
      additionalProperties: false
      required: [job]
      properties:
        job:
          $ref: "#/components/schemas/Job"
    Job:
      type: object
      additionalProperties: false
      required:
        - id
        - kind
        - status
        - target_device_ids
        - created_at
        - updated_at
      properties:
        id:
          type: string
        kind:
          type: string
          enum:
            - dashboard_push
            - image_push
            - image_url_push
            - webpage_push
            - history_resend
            - lineup_action
        status:
          description: Execution lifecycle only; quiet is a successful result
          type: string
          enum: [accepted, running, succeeded, failed]
        label:
          type: string
          nullable: true
        target_device_ids:
          type: array
          uniqueItems: true
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        result:
          allOf:
            - $ref: "#/components/schemas/JobResult"
          nullable: true
        error:
          allOf:
            - $ref: "#/components/schemas/JobFailure"
          nullable: true
    JobResult:
      type: object
      additionalProperties: false
      required: [status, device_ids]
      properties:
        status:
          type: string
          enum: [published, quiet]
        reason:
          type: string
          nullable: true
        device_ids:
          type: array
          uniqueItems: true
          items:
            type: string
        history_event_ids:
          description: >-
            Optional exact correlation to canonical History rows produced by
            this job. Clients may otherwise refresh History after termination.
          type: array
          uniqueItems: true
          items:
            type: string
    JobFailure:
      description: >-
        Stable failure details. URL-backed Jobs should distinguish policy
        refusal, fetch failure, render failure, and temporary renderer
        unavailability with safe machine-readable codes.
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ErrorResponse:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              enum:
                - invalid_request
                - unauthorized
                - not_found
                - pairing_expired
                - pairing_code_used
                - invalid_target
                - invalid_framing
                - invalid_snapshot
                - unsupported_personal_data_source
                - snapshot_out_of_order
                - snapshot_conflict
                - unsupported_image
                - image_too_large
                - url_blocked
                - idempotency_conflict
                - not_resendable
                - temporarily_unavailable
            message:
              type: string
            request_id:
              type: string
              nullable: true
security:
  - CompanionBearer: []
