name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ui-conventions:
    name: UI conventions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 Scripts/check_ui_conventions.py

  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Contracts/requirements.txt
      - run: python -m pip install -r Contracts/requirements.txt
      - run: python -m pytest Contracts

  swift-package:
    name: TesseraeKit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Run fixture-backed live transport tests
        run: |
          python3 Contracts/fixture_server.py --port 18765 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18765/api/app/v1 >/dev/null; then
              break
            fi
            sleep 0.25
          done
          TESSERAE_FIXTURE_BASE_URL=http://127.0.0.1:18765 \
            swift test --package-path Packages/TesseraeKit

  ios-build:
    name: iOS Simulator (${{ matrix.device }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v7
      - name: Build iOS app
        run: |
          xcodebuild \
            -project TesseraeCompanion.xcodeproj \
            -scheme TesseraeCompanion \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Run app unit and adaptive UI tests
        run: |
          destination_id="$(
            xcrun simctl list devices available -j | python3 -c '
          import json
          import sys

          family = "${{ matrix.device }}"
          def matches(device):
              kind = device.get("deviceTypeIdentifier", "")
              return family in kind and "iPhone-Duo" not in kind

          devices_by_runtime = json.load(sys.stdin)["devices"]
          candidates = [
              device["udid"]
              for runtime in sorted(devices_by_runtime, reverse=True)
              for device in devices_by_runtime[runtime]
              if device.get("isAvailable")
              and matches(device)
          ]
          if not candidates:
              raise SystemExit(f"No available {family} simulator; install the matching runtime")
          print(candidates[0])
          '
          )"
          # Ad hoc signing lets the simulator exercise real Keychain authorization.
          xcodebuild \
            -project TesseraeCompanion.xcodeproj \
            -scheme TesseraeCompanion \
            -destination "platform=iOS Simulator,id=${destination_id}" \
            -parallel-testing-enabled NO \
            -resultBundlePath "${RUNNER_TEMP}/TesseraeCompanion-${{ matrix.device }}.xcresult" \
            -only-testing:TesseraeCompanionTests \
            -only-testing:TesseraeCompanionUITests/AdaptiveLayoutUITests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            test

      - name: Upload failed simulator test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: simulator-${{ matrix.device }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/TesseraeCompanion-${{ matrix.device }}.xcresult
          if-no-files-found: ignore
          retention-days: 7

  ios-duo:
    name: iPhone Duo (configured runner)
    if: ${{ vars.IOS_DUO_RUNNER != '' }}
    runs-on: ${{ vars.IOS_DUO_RUNNER || 'macos-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'
      - name: Run app unit and adaptive UI tests
        run: |
          destination_id="$(
            xcrun simctl list devices available -j | python3 -c '
          import json
          import sys

          family = "Duo"
          def matches(device):
              kind = device.get("deviceTypeIdentifier", "")
              return "iPhone-Duo" in kind

          devices_by_runtime = json.load(sys.stdin)["devices"]
          candidates = [
              device["udid"]
              for runtime in sorted(devices_by_runtime, reverse=True)
              for device in devices_by_runtime[runtime]
              if device.get("isAvailable")
              and matches(device)
          ]
          if not candidates:
              raise SystemExit(f"No available {family} simulator; install the matching runtime")
          print(candidates[0])
          '
          )"
          # Ad hoc signing lets the simulator exercise real Keychain authorization.
          xcodebuild \
            -project TesseraeCompanion.xcodeproj \
            -scheme TesseraeCompanion \
            -destination "platform=iOS Simulator,id=${destination_id}" \
            -parallel-testing-enabled NO \
            -resultBundlePath "${RUNNER_TEMP}/TesseraeCompanion-Duo.xcresult" \
            -only-testing:TesseraeCompanionTests \
            -only-testing:TesseraeCompanionUITests/AdaptiveLayoutUITests \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGN_IDENTITY=- \
            test
      - name: Upload failed simulator test results
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: simulator-Duo-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/TesseraeCompanion-Duo.xcresult
          if-no-files-found: ignore
          retention-days: 7
