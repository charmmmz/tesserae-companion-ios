name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: Contracts/requirements.txt
      - run: python -m pip install -r Contracts/requirements.txt
      - run: python -m pytest Contracts

  swift-package:
    name: TesseraeKit
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Run fixture-backed live transport tests
        run: |
          python3 Contracts/fixture_server.py --port 18765 &
          fixture_pid=$!
          trap 'kill "$fixture_pid"' EXIT
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:18765/api/app/v1 >/dev/null; then
              break
            fi
            sleep 0.25
          done
          TESSERAE_FIXTURE_BASE_URL=http://127.0.0.1:18765 \
            swift test --package-path Packages/TesseraeKit

  ios-build:
    name: iOS Simulator build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - run: |
          xcodebuild \
            -project TesseraeCompanion.xcodeproj \
            -scheme TesseraeCompanion \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
