<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="tess-bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d8c7e"/>
      <stop offset="1" stop-color="#0a6f63"/>
    </linearGradient>
    <clipPath id="tess-inner">
      <rect x="220" y="220" width="584" height="584" rx="108" ry="108"/>
    </clipPath>
  </defs>

  <!-- Tesserae's official mark, expanded edge-to-edge for the iOS platform mask. -->
  <rect width="1024" height="1024" fill="url(#tess-bg)"/>
  <g clip-path="url(#tess-inner)" fill="#ffffff" fill-opacity="0.85">
    <rect x="512" y="220" width="292" height="292"/>
    <rect x="220" y="512" width="292" height="292"/>
  </g>
</svg>
